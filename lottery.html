<!-- ────────────── 광고: 헤더 하단 728x90 ────────────── -->

  </div>
</div>

<!-- ────────────── 본문 ────────────── -->
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">

      <!-- ① 설정 카드 -->
      <div id="setupCard" class="calc-card mb-4">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span style="font-size:1.6rem;">🎲</span>
          <span class="calc-title">제비뽑기</span>
        </div>
        <p class="text-muted small mb-4">이름들이 핀볼처럼 튕기며 떨어집니다. 먼저 골인하는 순서대로 당첨!</p>

        <div class="mb-3">
          <label class="form-label fw-semibold">
            참가자 이름
            <span class="text-muted fw-normal">(한 줄에 하나씩)</span>
          </label>
          <textarea id="nameInput" class="form-control" rows="7"
            placeholder="홍길동&#10;이순신&#10;김유신&#10;강감찬&#10;..."></textarea>

              value="1" min="1" style="max-width:100px;" />

        <div class="arena-wrap">

      <!-- ③ 결과 카드 -->

        <h3 class="fw-bold mb-3" style="font-size:1rem;">🏆 당첨자</h3>

        <button id="resetBtn" class="btn-calc mt-3" onclick="resetLottery()" style="display:none;">
          🔄 다시 하기

    </div>

<!-- ────────────── 광고: 결과 하단 300x250 ────────────── -->
<div class="container d-flex justify-content-center my-4">
  <div class="ad-slot ad-result">광고 (300×250)</div>
</div>

<!-- ────────────── 푸터 ────────────── -->
<footer class="site-footer py-4">
  <div class="container">
    <div class="d-flex justify-content-center mb-3">
      <div class="ad-slot ad-footer">광고 (320×50)</div>
    </div>
    <div class="text-center">
      <p class="mb-1">© 2024 유틸모음. 제공하는 계산 결과는 참고용이며 법적 효력이 없습니다.</p>
      <p class="mb-0"><a href="#">이용약관</a> · <a href="#">개인정보처리방침</a></p>
      <p class="mb-0 mt-2">
        <span id="visitor-count" class="text-muted" style="font-size:.8rem;">👁 방문자 집계 중...</span>
      </p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
// ─────────────────────────────────────────
//  상태
// ─────────────────────────────────────────
let totalWin   = 1;       // 당첨자 수
let balls      = [];      // 공 목록
let pegs       = [];      // 핀 목록
let bumpers    = [];      // 팝 범퍼(강한 반발)
let bars       = [];      // 회전 스피너 + 정적 디플렉터
let finishers  = [];      // 골인 순서대로 이름
let W = 0, H = 0;         // 아레나 논리 크기(px)
let goalY = 0;            // 골인 라인 y
let raf = null;
let lastT = 0;
let raceOver = false;

// 물리 상수
const GRAV      = 1400;   // 중력 px/s²
const PEG_REST  = 0.55;   // 핀 반발
const WALL_REST = 0.7;    // 벽 반발
const BALL_REST = 0.6;    // 공끼리 반발
const BUMP_KICK = 560;    // 범퍼 팝 세기 px/s
const MAX_SPEED = 1700;   // 최대 속도 제한
const SUB       = 6;      // 서브스텝
const PEG_R     = 5;

const BALL_COLORS = ['#60a5fa','#f59e0b','#34d399','#f87171','#a78bfa',
                     '#f472b6','#22d3ee','#fb923c','#a3e635','#e879f9'];

// ─────────────────────────────────────────
//  이름 입력 실시간 카운트
// ─────────────────────────────────────────
$('#nameInput').on('input', function () {
  const names = parseNames();
  $('#nameCount').text(names.length + '명 입력됨');

  // 당첨자 수 상한 보정
  const max = Math.max(1, names.length - 1);
  const cur = parseInt($('#winnerCount').val()) || 1;
  if (cur > max) $('#winnerCount').val(max);
  $('#winnerCount').attr('max', max);
});

function parseNames() {
  return $('#nameInput').val()
    .split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

// ─────────────────────────────────────────
//  시작
// ─────────────────────────────────────────
function startLottery() {
  const names = parseNames();
  if (names.length < 2) {
    alert('참가자를 2명 이상 입력해주세요.');
    return;
  }
  totalWin = Math.min(parseInt($('#winnerCount').val()) || 1, names.length - 1);

  $('#setupCard').hide();
  $('#resultCard').hide();
  $('#winnerList').empty();
  $('#resetBtn').hide();
  $('#lotteryCard').show();
  $('#roundBadge').text(`🏁 ${totalWin}명 골인 레이스`);
  $('#drawStatus').text('먼저 골인하는 이름이 당첨!');

  buildArena(names);
  drawScene();              // 출발 전 정지 화면
  countdownThenStart();
}

// ─────────────────────────────────────────
//  아레나 구성
// ─────────────────────────────────────────
const canvas = document.getElementById('arena');
const ctx    = canvas.getContext('2d');

function buildArena(names) {
  const wrap = canvas.parentElement;
  const cssW = wrap.clientWidth;
  // 아레나 세로 공간 2배 — 더 긴 레이스
  const cssH = Math.max(820, Math.min(1280, Math.round(cssW * 1.95)));
  const dpr  = window.devicePixelRatio || 1;

  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.height = cssH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = cssW; H = cssH;
  goalY = H - 56;

  const cols     = Math.max(4, Math.min(9, Math.round(W / 72)));
  const spacingX = W / (cols + 1);
  const spacingY = 64;
  const top      = 150;            // 공이 쏟아질 상단 여백
  const bottom   = goalY - 40;
  const span     = bottom - top;

  pegs = []; bars = []; bumpers = [];

  // ── 핀 그리드 (지그재그 + 지터 + 랜덤 구멍으로 불규칙하게) ──
  let row = 0;
  for (let y = top; y < bottom; y += spacingY, row++) {
    const offset = (row % 2 === 0) ? 0 : spacingX / 2;
    for (let c = 0; c <= cols; c++) {
      if (Math.random() < 0.13) continue;                 // 구멍
      const px = offset + c * spacingX + spacingX / 2 + (Math.random() - 0.5) * 12;
      const py = y + (Math.random() - 0.5) * 10;
      if (px > 12 && px < W - 12) pegs.push({ x: px, y: py });
    }
  }

  // ── 회전 스피너(파친코 풍차) — 여러 층, 좌우 번갈아 회전 ──
  [0.26, 0.42, 0.58, 0.74, 0.88].forEach((fy, k) => {
    bars.push({
      cx: (k % 2 === 0) ? W * 0.36 : W * 0.64,
      cy: top + span * fy,
      half: spacingX * 1.15,
      angle: Math.random() * Math.PI,
      omega: (k % 2 === 0 ? 1 : -1) * (3.2 + Math.random() * 1.6),
      th: 7, rest: 0.85, spin: true,
    });
  });
  // 중앙 대형 스피너
  bars.push({
    cx: W / 2, cy: top + span * 0.50,
    half: spacingX * 1.5, angle: 0,
    omega: (Math.random() < 0.5 ? 1 : -1) * 2.6,
    th: 8, rest: 0.85, spin: true,
  });

  // ── 비스듬한 정적 디플렉터(벽) — 레인을 좌우로 꺾어줌 ──
  bars.push({ cx: W * 0.13, cy: top + span * 0.34, half: W * 0.14, angle:  0.55, omega: 0, th: 6, rest: 0.55 });
  bars.push({ cx: W * 0.87, cy: top + span * 0.46, half: W * 0.14, angle: -0.55, omega: 0, th: 6, rest: 0.55 });
  bars.push({ cx: W * 0.15, cy: top + span * 0.66, half: W * 0.13, angle:  0.6,  omega: 0, th: 6, rest: 0.55 });
  bars.push({ cx: W * 0.85, cy: top + span * 0.80, half: W * 0.13, angle: -0.6,  omega: 0, th: 6, rest: 0.55 });

  // ── 팝 범퍼 — 닿으면 강하게 튕겨내 큰 변수 발생 ──
  [[0.30,0.30],[0.70,0.36],[0.50,0.46],[0.22,0.54],[0.78,0.60],
   [0.42,0.66],[0.62,0.72],[0.34,0.82],[0.66,0.86]].forEach(([fx, fy]) => {
    bumpers.push({ x: W * fx, y: top + span * fy, r: 15 + Math.random() * 7, flash: 0 });
  });

  // ── 공 생성 (시차 드롭 + 다양한 초기 속도) ──
  const r = Math.max(12, Math.min(18, spacingX * 0.24));
  balls = names.map((name, i) => ({
    name,
    x:  r + Math.random() * (W - 2 * r),
    y:  -(Math.random() * Math.max(420, H * 0.45) + 20),  // 위에서 시차를 두고 쏟아짐
    vx: (Math.random() - 0.5) * 170,
    vy:  Math.random() * 60,
    r,
    color: BALL_COLORS[i % BALL_COLORS.length],
    finished: false, win: false,
    label: fitLabel(name, r),
    tx: 0, ty: 0,                                          // 잔상용 직전 좌표
  }));

  finishers = [];
  raceOver  = false;
}

function fitLabel(name, r) {
  ctx.font = '700 12px Pretendard, sans-serif';
  let s = name;
  const maxW = 2 * r - 6;
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}

// ─────────────────────────────────────────
//  카운트다운 → 출발
// ─────────────────────────────────────────
function countdownThenStart() {
  const $cd = $('#countdown').show();
  const seq = ['3', '2', '1', 'GO!'];
  let i = 0;
  (function next() {
    if (i >= seq.length) { $cd.hide().empty(); startRace(); return; }
    $cd.html(`<span>${seq[i]}</span>`);
    i++;
    setTimeout(next, 750);
  })();
}

// ─────────────────────────────────────────
//  레이스 루프
// ─────────────────────────────────────────
function startRace() {
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
}

function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.033) dt = 0.033;        // 프레임 끊김 시 터널링 방지

  for (const b of balls) { b.tx = b.x; b.ty = b.y; }   // 잔상 기준점(프레임 시작 위치)

  const sdt = dt / SUB;
  for (let s = 0; s < SUB; s++) physics(sdt);

  drawScene();

  if (raceOver) { finishRace(); return; }
  raf = requestAnimationFrame(loop);
}

// 스피너 바 충돌 (캡슐) — 회전 표면 속도를 공에 전달해 후려침
function ballVsBar(b, bar) {
  const dirx = Math.cos(bar.angle), diry = Math.sin(bar.angle);
  const p1x = bar.cx - dirx * bar.half, p1y = bar.cy - diry * bar.half;
  const abx = dirx * bar.half * 2, aby = diry * bar.half * 2;
  let t = ((b.x - p1x) * abx + (b.y - p1y) * aby) / (abx * abx + aby * aby);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = p1x + abx * t, cy = p1y + aby * t;
  const dx = b.x - cx, dy = b.y - cy;
  const d2 = dx * dx + dy * dy;
  const min = b.r + bar.th;
  if (d2 < min * min && d2 > 0.0001) {
    const d = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;
    b.x += nx * (min - d); b.y += ny * (min - d);
    // 접점의 회전 표면 속도 (ω × r)
    const rx = cx - bar.cx, ry = cy - bar.cy;
    const vsx = -bar.omega * ry, vsy = bar.omega * rx;
    const vdot = (b.vx - vsx) * nx + (b.vy - vsy) * ny;
    if (vdot < 0) {
      const j = -(1 + bar.rest) * vdot;
      b.vx += j * nx; b.vy += j * ny;
    }
  }
}

// 팝 범퍼 충돌 — 항상 최소 BUMP_KICK 이상으로 강하게 튕겨냄
function ballVsBumper(b, bp) {
  const dx = b.x - bp.x, dy = b.y - bp.y;
  const d2 = dx * dx + dy * dy;
  const min = b.r + bp.r;
  if (d2 < min * min && d2 > 0.0001) {
    const d = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;
    b.x += nx * (min - d); b.y += ny * (min - d);
    let vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny; vn = b.vx * nx + b.vy * ny; }
    if (vn < BUMP_KICK) { const add = BUMP_KICK - vn; b.vx += add * nx; b.vy += add * ny; }
    const spin = (Math.random() - 0.5) * BUMP_KICK * 0.7;   // 접선 방향 무작위 회전
    b.vx += -ny * spin; b.vy += nx * spin;
    bp.flash = 1;
  }
}

function clampSpeed(b) {
  const s2 = b.vx * b.vx + b.vy * b.vy;
  if (s2 > MAX_SPEED * MAX_SPEED) { const k = MAX_SPEED / Math.sqrt(s2); b.vx *= k; b.vy *= k; }
}

function physics(dt) {
  // 스피너 회전
  for (const bar of bars) if (bar.omega) bar.angle += bar.omega * dt;

  for (const b of balls) {
    if (b.finished) {                 // 골인한 공은 그대로 떨어져 사라짐
      b.vy += GRAV * dt;
      b.y  += b.vy * dt;
      continue;
    }
    b.vy += GRAV * dt;
    b.x  += b.vx * dt;
    b.y  += b.vy * dt;

    // 좌우 벽
    if (b.x - b.r < 0) { b.x = b.r;     b.vx =  Math.abs(b.vx) * WALL_REST; }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * WALL_REST; }

    // 핀 충돌
    for (const p of pegs) {
      const dx = b.x - p.x, dy = b.y - p.y;
      const d2 = dx * dx + dy * dy;
      const min = b.r + PEG_R;
      if (d2 < min * min && d2 > 0.0001) {
        const d  = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        b.x += nx * (min - d); b.y += ny * (min - d);
        const vdot = b.vx * nx + b.vy * ny;
        if (vdot < 0) {
          b.vx -= (1 + PEG_REST) * vdot * nx;
          b.vy -= (1 + PEG_REST) * vdot * ny;
          b.vx += (Math.random() - 0.5) * 70;    // 약간의 혼돈
        }
      }
    }

    // 범퍼 · 스피너/디플렉터 충돌
    for (const bp of bumpers) ballVsBumper(b, bp);
    for (const bar of bars)   ballVsBar(b, bar);

    clampSpeed(b);
  }

  // 공끼리 충돌
  for (let i = 0; i < balls.length; i++) {
    const a = balls[i];
    if (a.finished) continue;
    for (let j = i + 1; j < balls.length; j++) {
      const b = balls[j];
      if (b.finished) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      const min = a.r + b.r;
      if (d2 < min * min && d2 > 0.0001) {
        const d  = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const overlap = (min - d) / 2;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const vdot = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vdot < 0) {
          const imp = -(1 + BALL_REST) * vdot / 2;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
        }
      }
    }
  }

  // 골인 판정
  for (const b of balls) {
    if (!b.finished && b.y + b.r >= goalY) {
      b.finished = true;
      if (finishers.length < totalWin) {
        finishers.push(b);
        b.win = true;
        onFinish(b, finishers.length);
        if (finishers.length >= totalWin) raceOver = true;
      }
    }
  }
}

// ─────────────────────────────────────────
//  렌더링
// ─────────────────────────────────────────
function drawScene() {
  ctx.clearRect(0, 0, W, H);

  // 골인 존
  const g = ctx.createLinearGradient(0, goalY, 0, H);
  g.addColorStop(0, 'rgba(16,185,129,.35)');
  g.addColorStop(1, 'rgba(16,185,129,.05)');
  ctx.fillStyle = g;
  ctx.fillRect(0, goalY, W, H - goalY);
  ctx.strokeStyle = 'rgba(16,185,129,.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, goalY); ctx.lineTo(W, goalY); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = '700 14px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏁 GOAL', W / 2, goalY + (H - goalY) / 2);

  // 핀
  ctx.fillStyle = 'rgba(148,163,184,.55)';
  for (const p of pegs) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, PEG_R, 0, Math.PI * 2);
    ctx.fill();
  }

  // 바 (스피너 / 디플렉터)
  ctx.lineCap = 'round';
  for (const bar of bars) {
    const dirx = Math.cos(bar.angle), diry = Math.sin(bar.angle);
    ctx.lineWidth = bar.th * 2;
    ctx.strokeStyle = bar.spin ? 'rgba(244,114,182,.92)' : 'rgba(148,163,184,.55)';
    ctx.beginPath();
    ctx.moveTo(bar.cx - dirx * bar.half, bar.cy - diry * bar.half);
    ctx.lineTo(bar.cx + dirx * bar.half, bar.cy + diry * bar.half);
    ctx.stroke();
    if (bar.spin) {
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(bar.cx, bar.cy, 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 범퍼
  for (const bp of bumpers) {
    ctx.beginPath();
    ctx.arc(bp.x, bp.y, bp.r, 0, Math.PI * 2);
    ctx.fillStyle   = `rgba(56,189,248,${0.22 + bp.flash * 0.5})`;
    ctx.fill();
    ctx.lineWidth   = 3;
    ctx.strokeStyle = `rgba(125,211,252,${0.45 + bp.flash * 0.55})`;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(bp.x, bp.y, bp.r * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + bp.flash * 0.5})`;
    ctx.fill();
    bp.flash = Math.max(0, bp.flash - 0.08);
  }

  // 공 잔상(트레일)
  ctx.lineCap = 'round';
  for (const b of balls) {
    if (b.finished || b.y - b.r > H) continue;
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = b.r * 1.4;
    ctx.beginPath();
    ctx.moveTo(b.tx, b.ty); ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 공
  for (const b of balls) {
    if (b.y - b.r > H) continue;       // 화면 밖으로 떨어진 공
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.win ? '#fbbf24' : b.color;
    ctx.fill();
    if (b.win) { ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); }
    ctx.fillStyle = b.win ? '#78350f' : '#0b1220';
    ctx.font = '700 12px Pretendard, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y);
  }
}

// ─────────────────────────────────────────
//  골인 처리
// ─────────────────────────────────────────
function onFinish(ball, rank) {
  $('#resultCard').show();
  $('#winnerList').append(`
    <div class="winner-item">
      <span style="font-size:1.3rem;">🏆</span>
      <span>${rank}등&nbsp; ${escHtml(ball.name)}</span>
    </div>
  `);
  $('#drawStatus').html(`🎉 <strong>${escHtml(ball.name)}</strong> 골인! (${rank}/${totalWin})`);
}

function finishRace() {
  $('#drawStatus').html('🎊 모든 당첨자가 결정됐습니다!');
  $('#resetBtn').show();
  launchConfetti();
}

// ─────────────────────────────────────────
//  리셋
// ─────────────────────────────────────────
function resetLottery() {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  balls = []; pegs = []; bumpers = []; bars = []; finishers = []; raceOver = true;
  $('#lotteryCard').hide();
  $('#resultCard').hide();
  $('#winnerList').empty();
  $('#resetBtn').hide();
  $('#nameInput').val('');
  $('#nameCount').text('0명 입력됨');
  $('#winnerCount').val(1).attr('max', '');
  $('#setupCard').show();
}

// ─────────────────────────────────────────
//  컨페티
// ─────────────────────────────────────────
function launchConfetti() {
  const colors = ['#1a56db','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4'];
  const wrap   = $('<div class="confetti-wrap"></div>').appendTo('body');

  for (let i = 0; i < 90; i++) {
    const size = 7 + Math.random() * 9;
    $('<div class="confetti-piece"></div>').css({
      left:              Math.random() * 100 + 'vw',
      width:             size + 'px',
      height:            size + 'px',
      background:        colors[i % colors.length],
      animationDuration: (1.4 + Math.random() * 2.2) + 's',
      animationDelay:    (Math.random() * 1.2) + 's',
    }).appendTo(wrap);
  }

  setTimeout(() => wrap.remove(), 5000);
}

// ─────────────────────────────────────────
//  XSS 방지용 이스케이프
// ─────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────────
//  방문자 카운터
// ─────────────────────────────────────────
(async function () {
  const API = 'https://utilmoeum-proxy.stdioh.workers.dev/api/visitors';
  try {
    let count;
    if (!sessionStorage.getItem('visit_counted')) {
      const res = await fetch(API, { method: 'POST' });
      const data = await res.json();
      count = data.count;
      sessionStorage.setItem('visit_counted', '1');
    } else {
      const res = await fetch(API);
      const data = await res.json();
      count = data.count;
    }
    document.getElementById('visitor-count').textContent =
      '👁 오늘 방문자: ' + count.toLocaleString('ko-KR') + '명';
  } catch (e) {
    document.getElementById('visitor-count').textContent = '';
  }
})();
</script>
