<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제비뽑기 - 유틸모음</title>
  <meta name="description" content="이름을 입력하고 당첨자 수를 정해 랜덤으로 뽑아보세요. 핀볼처럼 공이 튕기며 먼저 골인하는 이름이 당첨!" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="제비뽑기 - 유틸모음" />
  <meta property="og:description" content="이름을 입력하고 당첨자 수를 정해 랜덤으로 뽑아보세요." />
  <meta property="og:url" content="https://utilmoeum.pages.dev/lottery.html" />
  <link rel="canonical" href="https://utilmoeum.pages.dev/lottery.html" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ────────────── 헤더 ────────────── -->
<header class="site-header py-3">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="site-logo">⚙️ 유틸모음</a>
    <a href="index.html" class="btn btn-sm btn-outline-secondary">← 목록으로</a>
  </div>
</header>

<!-- ────────────── 광고: 헤더 하단 728x90 ────────────── -->
<div class="py-2 bg-white border-bottom">
  <div class="container d-flex justify-content-center">
    <div class="ad-slot ad-header">광고 (728×90)</div>
  </div>
</div>

<!-- ────────────── 본문 ────────────── -->
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">

      <!-- ① 설정 카드 -->
      <div id="setupCard" class="calc-card mb-4">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span style="font-size:1.6rem;">🎲</span>
          <span class="calc-title">제비뽑기</span>
        </div>
        <p class="text-muted small mb-4">이름들이 핀볼처럼 튕기며 떨어집니다. 먼저 골인하는 순서대로 당첨!</p>

        <div class="mb-3">
          <label class="form-label fw-semibold">
            참가자 이름
            <span class="text-muted fw-normal">(한 줄에 하나씩)</span>
          </label>
          <textarea id="nameInput" class="form-control" rows="7"
            placeholder="홍길동&#10;이순신&#10;김유신&#10;강감찬&#10;..."></textarea>
          <div class="form-text" id="nameCount">0명 입력됨</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">당첨자 수</label>
          <div class="d-flex align-items-center gap-2">
            <input type="number" id="winnerCount" class="form-control"
              value="1" min="1" style="max-width:100px;" />
            <span class="text-muted small">명</span>
          </div>
        </div>

        <button class="btn-calc" onclick="startLottery()">🎲 뽑기 시작!</button>
      </div>

      <!-- ② 뽑기 카드 -->
      <div id="lotteryCard" class="calc-card mb-4" style="display:none;">

        <div class="text-center mb-3">
          <div id="roundBadge"
            class="d-inline-block text-white fw-bold px-3 py-1 rounded-pill mb-2"
            style="background:var(--primary); font-size:1rem;">
            🏁 골인 레이스
          </div>
          <div id="drawStatus" class="draw-status text-muted">
            먼저 골인하는 이름이 당첨!
          </div>
        </div>

        <div class="arena-wrap">
          <canvas id="arena"></canvas>
          <div id="countdown" class="countdown-overlay" style="display:none;"></div>
        </div>
      </div>

      <!-- ③ 결과 카드 -->
      <div id="resultCard" class="calc-card" style="display:none;">
        <h3 class="fw-bold mb-3" style="font-size:1rem;">🏆 당첨자</h3>
        <div id="winnerList"></div>
        <button id="resetBtn" class="btn-calc mt-3" onclick="resetLottery()" style="display:none;">
          🔄 다시 하기
        </button>
      </div>

    </div>
  </div>
</main>

<!-- ────────────── 광고: 결과 하단 300x250 ────────────── -->
<div class="container d-flex justify-content-center my-4">
  <div class="ad-slot ad-result">광고 (300×250)</div>
</div>

<!-- ────────────── 푸터 ────────────── -->
<footer class="site-footer py-4">
  <div class="container">
    <div class="d-flex justify-content-center mb-3">
      <div class="ad-slot ad-footer">광고 (320×50)</div>
    </div>
    <div class="text-center">
      <p class="mb-1">© 2024 유틸모음. 제공하는 계산 결과는 참고용이며 법적 효력이 없습니다.</p>
      <p class="mb-0"><a href="#">이용약관</a> · <a href="#">개인정보처리방침</a></p>
      <p class="mb-0 mt-2">
        <span id="visitor-count" class="text-muted" style="font-size:.8rem;">👁 방문자 집계 중...</span>
      </p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
// ─────────────────────────────────────────
//  상태
// ─────────────────────────────────────────
let totalWin   = 1;       // 당첨자 수
let balls      = [];      // 공 목록
let pegs       = [];      // 핀 목록
let finishers  = [];      // 골인 순서대로 이름
let W = 0, H = 0;         // 아레나 논리 크기(px)
let goalY = 0;            // 골인 라인 y
let raf = null;
let lastT = 0;
let raceOver = false;

// 물리 상수
const GRAV      = 1500;   // 중력 px/s²
const PEG_REST  = 0.55;   // 핀 반발
const WALL_REST = 0.7;    // 벽 반발
const BALL_REST = 0.6;    // 공끼리 반발
const SUB       = 5;      // 서브스텝
const PEG_R     = 5;

const BALL_COLORS = ['#60a5fa','#f59e0b','#34d399','#f87171','#a78bfa',
                     '#f472b6','#22d3ee','#fb923c','#a3e635','#e879f9'];

// ─────────────────────────────────────────
//  이름 입력 실시간 카운트
// ─────────────────────────────────────────
$('#nameInput').on('input', function () {
  const names = parseNames();
  $('#nameCount').text(names.length + '명 입력됨');

  // 당첨자 수 상한 보정
  const max = Math.max(1, names.length - 1);
  const cur = parseInt($('#winnerCount').val()) || 1;
  if (cur > max) $('#winnerCount').val(max);
  $('#winnerCount').attr('max', max);
});

function parseNames() {
  return $('#nameInput').val()
    .split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

// ─────────────────────────────────────────
//  시작
// ─────────────────────────────────────────
function startLottery() {
  const names = parseNames();
  if (names.length < 2) {
    alert('참가자를 2명 이상 입력해주세요.');
    return;
  }
  totalWin = Math.min(parseInt($('#winnerCount').val()) || 1, names.length - 1);

  $('#setupCard').hide();
  $('#resultCard').hide();
  $('#winnerList').empty();
  $('#resetBtn').hide();
  $('#lotteryCard').show();
  $('#roundBadge').text(`🏁 ${totalWin}명 골인 레이스`);
  $('#drawStatus').text('먼저 골인하는 이름이 당첨!');

  buildArena(names);
  drawScene();              // 출발 전 정지 화면
  countdownThenStart();
}

// ─────────────────────────────────────────
//  아레나 구성
// ─────────────────────────────────────────
const canvas = document.getElementById('arena');
const ctx    = canvas.getContext('2d');

function buildArena(names) {
  const wrap = canvas.parentElement;
  const cssW = wrap.clientWidth;
  const cssH = Math.max(440, Math.min(620, Math.round(cssW * 1.05)));
  const dpr  = window.devicePixelRatio || 1;

  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.height = cssH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = cssW; H = cssH;
  goalY = H - 56;

  // 핀 배치 (지그재그 — 파친코 스타일)
  const cols     = Math.max(4, Math.min(9, Math.round(W / 72)));
  const spacingX = W / (cols + 1);
  const spacingY = 56;
  const topPad   = 150;            // 공이 쏟아질 상단 여백
  pegs = [];
  for (let row = 0; (topPad + row * spacingY) < goalY - 40; row++) {
    const offset = (row % 2 === 0) ? 0 : spacingX / 2;
    const py = topPad + row * spacingY;
    for (let c = 0; c <= cols; c++) {
      const px = offset + c * spacingX + spacingX / 2;
      if (px > 6 && px < W - 6) pegs.push({ x: px, y: py });
    }
  }

  // 공 생성
  const r = Math.max(13, Math.min(20, spacingX * 0.26));
  balls = names.map((name, i) => ({
    name,
    x:  r + Math.random() * (W - 2 * r),
    y:  -(Math.random() * 320 + 20),   // 위에서 시차를 두고 쏟아짐
    vx: (Math.random() - 0.5) * 80,
    vy: 0,
    r,
    color: BALL_COLORS[i % BALL_COLORS.length],
    finished: false,
    win: false,
    label: fitLabel(name, r),
  }));

  finishers = [];
  raceOver  = false;
}

function fitLabel(name, r) {
  ctx.font = '700 12px Pretendard, sans-serif';
  let s = name;
  const maxW = 2 * r - 6;
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}

// ─────────────────────────────────────────
//  카운트다운 → 출발
// ─────────────────────────────────────────
function countdownThenStart() {
  const $cd = $('#countdown').show();
  const seq = ['3', '2', '1', 'GO!'];
  let i = 0;
  (function next() {
    if (i >= seq.length) { $cd.hide().empty(); startRace(); return; }
    $cd.html(`<span>${seq[i]}</span>`);
    i++;
    setTimeout(next, 750);
  })();
}

// ─────────────────────────────────────────
//  레이스 루프
// ─────────────────────────────────────────
function startRace() {
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
}

function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.033) dt = 0.033;        // 프레임 끊김 시 터널링 방지

  const sdt = dt / SUB;
  for (let s = 0; s < SUB; s++) physics(sdt);

  drawScene();

  if (raceOver) { finishRace(); return; }
  raf = requestAnimationFrame(loop);
}

function physics(dt) {
  for (const b of balls) {
    if (b.finished) {                 // 골인한 공은 그대로 떨어져 사라짐
      b.vy += GRAV * dt;
      b.y  += b.vy * dt;
      continue;
    }
    b.vy += GRAV * dt;
    b.x  += b.vx * dt;
    b.y  += b.vy * dt;

    // 좌우 벽
    if (b.x - b.r < 0) { b.x = b.r;     b.vx =  Math.abs(b.vx) * WALL_REST; }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * WALL_REST; }

    // 핀 충돌
    for (const p of pegs) {
      const dx = b.x - p.x, dy = b.y - p.y;
      const d2 = dx * dx + dy * dy;
      const min = b.r + PEG_R;
      if (d2 < min * min && d2 > 0.0001) {
        const d  = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        b.x += nx * (min - d); b.y += ny * (min - d);
        const vdot = b.vx * nx + b.vy * ny;
        if (vdot < 0) {
          b.vx -= (1 + PEG_REST) * vdot * nx;
          b.vy -= (1 + PEG_REST) * vdot * ny;
          b.vx += (Math.random() - 0.5) * 60;    // 약간의 혼돈
        }
      }
    }
  }

  // 공끼리 충돌
  for (let i = 0; i < balls.length; i++) {
    const a = balls[i];
    if (a.finished) continue;
    for (let j = i + 1; j < balls.length; j++) {
      const b = balls[j];
      if (b.finished) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      const min = a.r + b.r;
      if (d2 < min * min && d2 > 0.0001) {
        const d  = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const overlap = (min - d) / 2;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const vdot = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vdot < 0) {
          const imp = -(1 + BALL_REST) * vdot / 2;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
        }
      }
    }
  }

  // 골인 판정
  for (const b of balls) {
    if (!b.finished && b.y + b.r >= goalY) {
      b.finished = true;
      if (finishers.length < totalWin) {
        finishers.push(b);
        b.win = true;
        onFinish(b, finishers.length);
        if (finishers.length >= totalWin) raceOver = true;
      }
    }
  }
}

// ─────────────────────────────────────────
//  렌더링
// ─────────────────────────────────────────
function drawScene() {
  ctx.clearRect(0, 0, W, H);

  // 골인 존
  const g = ctx.createLinearGradient(0, goalY, 0, H);
  g.addColorStop(0, 'rgba(16,185,129,.35)');
  g.addColorStop(1, 'rgba(16,185,129,.05)');
  ctx.fillStyle = g;
  ctx.fillRect(0, goalY, W, H - goalY);
  ctx.strokeStyle = 'rgba(16,185,129,.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, goalY); ctx.lineTo(W, goalY); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = '700 14px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏁 GOAL', W / 2, goalY + (H - goalY) / 2);

  // 핀
  ctx.fillStyle = 'rgba(148,163,184,.55)';
  for (const p of pegs) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, PEG_R, 0, Math.PI * 2);
    ctx.fill();
  }

  // 공
  for (const b of balls) {
    if (b.y - b.r > H) continue;       // 화면 밖으로 떨어진 공
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.win ? '#fbbf24' : b.color;
    ctx.fill();
    if (b.win) { ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); }
    ctx.fillStyle = b.win ? '#78350f' : '#0b1220';
    ctx.font = '700 12px Pretendard, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y);
  }
}

// ─────────────────────────────────────────
//  골인 처리
// ─────────────────────────────────────────
function onFinish(ball, rank) {
  $('#resultCard').show();
  $('#winnerList').append(`
    <div class="winner-item">
      <span style="font-size:1.3rem;">🏆</span>
      <span>${rank}등&nbsp; ${escHtml(ball.name)}</span>
    </div>
  `);
  $('#drawStatus').html(`🎉 <strong>${escHtml(ball.name)}</strong> 골인! (${rank}/${totalWin})`);
}

function finishRace() {
  $('#drawStatus').html('🎊 모든 당첨자가 결정됐습니다!');
  $('#resetBtn').show();
  launchConfetti();
}

// ─────────────────────────────────────────
//  리셋
// ─────────────────────────────────────────
function resetLottery() {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  balls = []; pegs = []; finishers = []; raceOver = true;
  $('#lotteryCard').hide();
  $('#resultCard').hide();
  $('#winnerList').empty();
  $('#resetBtn').hide();
  $('#nameInput').val('');
  $('#nameCount').text('0명 입력됨');
  $('#winnerCount').val(1).attr('max', '');
  $('#setupCard').show();
}

// ─────────────────────────────────────────
//  컨페티
// ─────────────────────────────────────────
function launchConfetti() {
  const colors = ['#1a56db','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4'];
  const wrap   = $('<div class="confetti-wrap"></div>').appendTo('body');

  for (let i = 0; i < 90; i++) {
    const size = 7 + Math.random() * 9;
    $('<div class="confetti-piece"></div>').css({
      left:              Math.random() * 100 + 'vw',
      width:             size + 'px',
      height:            size + 'px',
      background:        colors[i % colors.length],
      animationDuration: (1.4 + Math.random() * 2.2) + 's',
      animationDelay:    (Math.random() * 1.2) + 's',
    }).appendTo(wrap);
  }

  setTimeout(() => wrap.remove(), 5000);
}

// ─────────────────────────────────────────
//  XSS 방지용 이스케이프
// ─────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────────
//  방문자 카운터
// ─────────────────────────────────────────
(async function () {
  const API = 'https://utilmoeum-proxy.stdioh.workers.dev/api/visitors';
  try {
    let count;
    if (!sessionStorage.getItem('visit_counted')) {
      const res = await fetch(API, { method: 'POST' });
      const data = await res.json();
      count = data.count;
      sessionStorage.setItem('visit_counted', '1');
    } else {
      const res = await fetch(API);
      const data = await res.json();
      count = data.count;
    }
    document.getElementById('visitor-count').textContent =
      '👁 오늘 방문자: ' + count.toLocaleString('ko-KR') + '명';
  } catch (e) {
    document.getElementById('visitor-count').textContent = '';
  }
})();
</script>
</body>
</html>
