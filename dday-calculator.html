<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D-Day 계산기 - 유틸모음</title>
  <meta name="description" content="특정 날짜까지 남은 일수 또는 경과 일수를 계산합니다." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="D-Day 계산기 - 유틸모음" />
  <meta property="og:description" content="특정 날짜까지 남은 일수 또는 경과 일수를 계산합니다." />
  <meta property="og:url" content="https://utilmoeum.pages.dev/dday-calculator.html" />
  <link rel="canonical" href="https://utilmoeum.pages.dev/dday-calculator.html" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ────────────── 헤더 ────────────── -->
<header class="site-header py-3">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="site-logo">⚙️ 유틸모음</a>
    <a href="index.html" class="btn btn-sm btn-outline-secondary">← 목록으로</a>
  </div>
</header>

<!-- ────────────── 광고: 헤더 하단 728x90 ────────────── -->
<div class="py-2 bg-white border-bottom">
  <div class="container d-flex justify-content-center">
    <div class="ad-slot ad-header">광고 (728×90)</div>
  </div>
</div>

<!-- ────────────── 본문 ────────────── -->
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-7">

      <!-- 입력 카드 -->
      <div class="calc-card mb-4">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span style="font-size:1.6rem;">📅</span>
          <span class="calc-title">D-Day 계산기</span>
        </div>
        <p class="text-muted small mb-4">특정 날짜까지 남은 일수 또는 경과 일수 계산</p>

        <div class="mb-3">
          <label for="targetDate" class="form-label fw-semibold">목표 날짜</label>
          <input type="date" id="targetDate" class="form-control form-control-lg" />
        </div>

        <div class="mb-4">
          <label for="eventName" class="form-label fw-semibold">이벤트 이름 <span class="text-muted fw-normal">(선택)</span></label>
          <input type="text" id="eventName" class="form-control" placeholder="예: 수능, 결혼기념일, 휴가" maxlength="30" />
        </div>

        <button class="btn-calc" onclick="calculate()">계산하기</button>
      </div>

      <!-- 결과 영역 -->
      <div id="resultArea" style="display:none;">

        <!-- D-Day 수치 -->
        <div class="result-box mb-4">
          <div class="label" id="eventLabel">D-Day</div>
          <div class="amount" id="ddayValue">—</div>
          <div class="sub" id="ddaySub">—</div>
        </div>

        <!-- 상세 카드 -->
        <div class="calc-card mb-4">
          <h3 class="fw-bold mb-3" style="font-size:1rem;">상세 정보</h3>
          <div class="deduction-table">
            <table class="table table-bordered">
              <tbody>
                <tr>
                  <td class="fw-semibold">오늘</td>
                  <td class="text-end" id="todayStr">—</td>
                </tr>
                <tr>
                  <td class="fw-semibold">목표 날짜</td>
                  <td class="text-end" id="targetStr">—</td>
                </tr>
                <tr>
                  <td class="fw-semibold">주 단위</td>
                  <td class="text-end" id="weeksVal">—</td>
                </tr>
                <tr class="total-row">
                  <td class="fw-bold">개월 단위 (약)</td>
                  <td class="text-end fw-bold" id="monthsVal">—</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 광고: 결과 바로 아래 300x250 -->
        <div class="d-flex justify-content-center mb-4">
          <div class="ad-slot ad-result">광고 (300×250)</div>
        </div>

      </div><!-- /resultArea -->

    </div>
  </div>
</main>

<!-- ────────────── 푸터 ────────────── -->
<footer class="site-footer py-4">
  <div class="container">
    <div class="d-flex justify-content-center mb-3">
      <div class="ad-slot ad-footer">광고 (320×50)</div>
    </div>
    <div class="text-center">
      <p class="mb-1">© 2024 유틸모음. 제공하는 계산 결과는 참고용이며 법적 효력이 없습니다.</p>
      <p class="mb-0"><a href="#">이용약관</a> · <a href="#">개인정보처리방침</a></p>
      <p class="mb-0 mt-2">
        <span id="visitor-count" class="text-muted" style="font-size:.8rem;">👁 방문자 집계 중...</span>
      </p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
// 오늘 날짜를 기본값으로 설정
(function () {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm   = String(today.getMonth() + 1).padStart(2, '0');
  const dd   = String(today.getDate()).padStart(2, '0');
  $('#targetDate').val(`${yyyy}-${mm}-${dd}`);
})();

function fmtDate(date) {
  const yyyy = date.getFullYear();
  const mm   = String(date.getMonth() + 1).padStart(2, '0');
  const dd   = String(date.getDate()).padStart(2, '0');
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return `${yyyy}년 ${mm}월 ${dd}일 (${days[date.getDay()]}요일)`;
}

function calculate() {
  const targetVal = $('#targetDate').val();
  if (!targetVal) {
    alert('날짜를 선택해주세요.');
    return;
  }

  const today  = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(targetVal);
  target.setHours(0, 0, 0, 0);

  const diffMs   = target - today;
  const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

  const eventName = $('#eventName').val().trim() || 'D-Day';

  let ddayText, subText;
  if (diffDays > 0) {
    ddayText = `D-${diffDays}`;
    subText  = `${diffDays}일 후`;
  } else if (diffDays < 0) {
    ddayText = `D+${Math.abs(diffDays)}`;
    subText  = `${Math.abs(diffDays)}일 경과`;
  } else {
    ddayText = 'D-Day';
    subText  = '오늘이 바로 그 날입니다!';
  }

  const weeks  = Math.floor(Math.abs(diffDays) / 7);
  const months = (Math.abs(diffDays) / 30.44).toFixed(1);

  $('#eventLabel').text(eventName);
  $('#ddayValue').text(ddayText);
  $('#ddaySub').text(subText);
  $('#todayStr').text(fmtDate(today));
  $('#targetStr').text(fmtDate(target));
  $('#weeksVal').text(`약 ${weeks}주 ${Math.abs(diffDays) % 7}일`);
  $('#monthsVal').text(`약 ${months}개월`);

  $('#resultArea').fadeIn(300);
  $('html, body').animate({ scrollTop: $('#resultArea').offset().top - 20 }, 400);
}

$('#targetDate').on('keydown', function (e) {
  if (e.key === 'Enter') calculate();
});

(async function () {
  const API = 'https://utilmoeum-proxy.stdioh.workers.dev/api/visitors';
  try {
    let count;
    if (!sessionStorage.getItem('visit_counted')) {
      const res = await fetch(API, { method: 'POST' });
      const data = await res.json();
      count = data.count;
      sessionStorage.setItem('visit_counted', '1');
    } else {
      const res = await fetch(API);
      const data = await res.json();
      count = data.count;
    }
    document.getElementById('visitor-count').textContent =
      '👁 오늘 방문자: ' + count.toLocaleString('ko-KR') + '명';
  } catch (e) {
    document.getElementById('visitor-count').textContent = '';
  }
})();
</script>
</body>
</html>
