<!DOCTYPE html>

<body>

<!-- ────────────── 헤더 ────────────── -->
<header class="site-header py-3">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="site-logo">⚙️ 유틸모음</a>
    <a href="index.html" class="btn btn-sm btn-outline-secondary">← 목록으로</a>
  </div>
</header>

<!-- ────────────── 광고: 헤더 하단 728x90 ────────────── -->
<div class="py-2 bg-white border-bottom">
  <div class="container d-flex justify-content-center">
    <div class="ad-slot ad-header">광고 (728×90)</div>
  </div>
</div>

<!-- ────────────── 본문 ────────────── -->
<main class="container py-5">

  <!-- 타이틀 & 월 선택 -->
  <div class="calc-card mb-4">
    <div class="d-flex align-items-center gap-2 mb-1">
      <span style="font-size:1.6rem;">🏠</span>
      <span class="calc-title">서울 강서구 아파트 실거래가</span>
    </div>
    <p class="text-muted small mb-4">국토교통부 실거래가 공개시스템 데이터 기준</p>

    <div class="d-flex align-items-center gap-2 flex-wrap">
      <div>
        <label for="dateFrom" class="form-label fw-semibold mb-1">시작일</label>
        <input type="date" id="dateFrom" class="form-control" style="width:160px;" />
      </div>
      <div class="mt-3 fw-bold text-muted">~</div>
      <div>
        <label for="dateTo" class="form-label fw-semibold mb-1">종료일</label>
        <input type="date" id="dateTo" class="form-control" style="width:160px;" />
      </div>
      <div class="mt-3">
        <button class="btn-calc" id="searchBtn" onclick="loadData()" style="width:auto; padding:.6rem 1.5rem;">조회</button>
      </div>
    </div>
  </div>

  <!-- 결과 영역 -->
  <div id="resultArea" style="display:none;">

    <div class="calc-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0" style="font-size:1rem;" id="resultTitle">—</h3>
        <span class="text-muted small" id="totalCount"></span>
      </div>

      <div class="table-responsive deduction-table">
        <table class="table table-bordered table-hover" id="resultTable">
          <thead>
            <tr>
              <th>아파트</th>
              <th class="text-end">거래금액</th>
              <th class="text-center">전용면적</th>
              <th class="text-center">층</th>
              <th class="text-center">계약일</th>
              <th>도로명</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 광고: 결과 바로 아래 300x250 -->
    <div class="d-flex justify-content-center mb-4">
      <div class="ad-slot ad-result">광고 (300×250)</div>
    </div>

  </div><!-- /resultArea -->

  <!-- 로딩 -->
  <div id="loadingArea" class="text-center py-5" style="display:none;">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-2 small">데이터를 불러오는 중...</p>
  </div>

  <!-- 오류 -->
  <div id="errorArea" class="calc-card text-center py-4" style="display:none;">
    <p class="text-danger mb-0" id="errorMsg"></p>
  </div>

</main>

<!-- ────────────── 푸터 ────────────── -->
<footer class="site-footer py-4">
  <div class="container">
    <div class="d-flex justify-content-center mb-3">
      <div class="ad-slot ad-footer">광고 (320×50)</div>
    </div>
    <div class="text-center">
      <p class="mb-1">© 2024 유틸모음. 제공하는 계산 결과는 참고용이며 법적 효력이 없습니다.</p>
      <p class="mb-0"><a href="#">이용약관</a> · <a href="#">개인정보처리방침</a></p>
      <p class="mb-0 mt-2">
        <span id="visitor-count" class="text-muted" style="font-size:.8rem;">👁 방문자 집계 중...</span>
      </p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
const WORKER_URL = 'https://utilmoeum-proxy.stdioh.workers.dev';
const LAWD_CD    = '11500'; // 서울 강서구

// ── 기본값: 이번 달 1일 ~ 오늘 ──
(function initDate() {
  const today = new Date();
  const yyyy  = today.getFullYear();
  const mm    = String(today.getMonth() + 1).padStart(2, '0');
  const dd    = String(today.getDate()).padStart(2, '0');
  document.getElementById('dateFrom').value = `${yyyy}-${mm}-01`;
  document.getElementById('dateTo').value   = `${yyyy}-${mm}-${dd}`;
})();

function fmtPrice(raw) {
  const n = parseInt(raw.replace(/,/g, '').trim(), 10);
  if (n >= 10000) {
    const uk  = Math.floor(n / 10000);
    const rem = n % 10000;
    return rem > 0
      ? `${uk.toLocaleString()}억 ${rem.toLocaleString()}만원`
      : `${uk.toLocaleString()}억원`;
  }
  return `${n.toLocaleString()}만원`;
}

function getTag(xml, tag) {
  const el = xml.querySelector(tag);
  return el ? el.textContent.trim() : '';
}

// 범위 내 월 목록 반환 (YYYYMM 배열)
function getMonthsInRange(fromDate, toDate) {
  const months = [];
  const cur = new Date(fromDate.getFullYear(), fromDate.getMonth(), 1);
  const end = new Date(toDate.getFullYear(), toDate.getMonth(), 1);
  while (cur <= end) {
    const yyyy = cur.getFullYear();
    const mm   = String(cur.getMonth() + 1).padStart(2, '0');
    months.push(`${yyyy}${mm}`);
    cur.setMonth(cur.getMonth() + 1);
  }
  return months;
}

async function fetchMonth(dealYmd) {
  const url = `${WORKER_URL}?LAWD_CD=${LAWD_CD}&DEAL_YMD=${dealYmd}&numOfRows=1000&pageNo=1`;
  const res  = await fetch(url);
  const text = await res.text();
  const parser = new DOMParser();
  return parser.parseFromString(text, 'application/xml');
}

async function loadData() {
  const fromVal = document.getElementById('dateFrom').value;
  const toVal   = document.getElementById('dateTo').value;
  if (!fromVal || !toVal) { alert('시작일과 종료일을 모두 선택해주세요.'); return; }
  if (fromVal > toVal) { alert('시작일이 종료일보다 늦습니다.'); return; }

  const fromDate = new Date(fromVal);
  const toDate   = new Date(toVal);
  const months   = getMonthsInRange(fromDate, toDate);
  if (months.length > 3) { alert('조회 기간은 최대 3개월까지 가능합니다.'); return; }

  $('#resultArea').hide();
  $('#errorArea').hide();
  $('#loadingArea').show();

  try {
    // 해당 월들을 병렬 조회
    const xmlDocs = await Promise.all(months.map(fetchMonth));

    const fromTs = fromDate.getTime();
    const toTs   = toDate.getTime();

    const items = xmlDocs.flatMap(xml => {
      const resultCode = getTag(xml, 'resultCode');
      if (resultCode && resultCode !== '00' && resultCode !== '000') return [];
      return Array.from(xml.querySelectorAll('item')).filter(item => {
        const y = parseInt(getTag(item, 'dealYear'),  10);
        const m = parseInt(getTag(item, 'dealMonth'), 10) - 1;
        const d = parseInt(getTag(item, 'dealDay'),   10);
        const t = new Date(y, m, d).getTime();
        return t >= fromTs && t <= toTs;
      });
    });

    if (items.length === 0) {
      throw new Error('해당 기간의 거래 데이터가 없습니다.');
    }

    // 계약일 내림차순 → 거래금액 내림차순
    items.sort((a, b) => {
      const da = new Date(getTag(a,'dealYear'), getTag(a,'dealMonth')-1, getTag(a,'dealDay'));
      const db = new Date(getTag(b,'dealYear'), getTag(b,'dealMonth')-1, getTag(b,'dealDay'));
      if (db - da !== 0) return db - da;
      return parseInt(getTag(b,'dealAmount').replace(/,/g,''),10)
           - parseInt(getTag(a,'dealAmount').replace(/,/g,''),10);
    });

    const fLabel = fromVal.replace(/-/g, '.').replace(/\.0/g, '.');
    const tLabel = toVal.replace(/-/g, '.').replace(/\.0/g, '.');
    $('#resultTitle').text(`강서구 아파트 실거래가 (${fLabel} ~ ${tLabel})`);
    $('#totalCount').text(`총 ${items.length}건`);

    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';

    items.forEach(item => {
      const aptName = getTag(item, 'aptNm');
      const price   = fmtPrice(getTag(item, 'dealAmount'));
      const area    = parseFloat(getTag(item, 'excluUseAr')).toFixed(1);
      const floor   = getTag(item, 'floor');
      const year    = getTag(item, 'dealYear');
      const month   = getTag(item, 'dealMonth').padStart(2, '0');
      const day     = getTag(item, 'dealDay').padStart(2, '0');
      const road    = getTag(item, 'roadNm');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="fw-semibold">${aptName}</td>
        <td class="text-end fw-bold text-primary">${price}</td>
        <td class="text-center">${area}㎡</td>
        <td class="text-center">${floor}층</td>
        <td class="text-center text-muted small">${year}.${month}.${day}</td>
        <td class="text-muted small">${road}</td>
      `;
      tbody.appendChild(tr);
    });

    $('#loadingArea').hide();
    $('#resultArea').fadeIn(300);
    $('html, body').animate({ scrollTop: $('#resultArea').offset().top - 20 }, 400);

  } catch (e) {
    $('#loadingArea').hide();
    $('#errorMsg').text(e.message || '데이터를 불러오지 못했습니다.');
    $('#errorArea').show();
  }
}

$('#dateFrom, #dateTo').on('keydown', function (e) {
  if (e.key === 'Enter') loadData();
});

// 페이지 로드 시 자동 조회
$(function () { loadData(); });

(async function () {
  const API = 'https://utilmoeum-proxy.stdioh.workers.dev/api/visitors';
  try {
    let count;
    if (!sessionStorage.getItem('visit_counted')) {
      const res = await fetch(API, { method: 'POST' });
      const data = await res.json();
      count = data.count;
      sessionStorage.setItem('visit_counted', '1');
    } else {
      const res = await fetch(API);
      const data = await res.json();
      count = data.count;
    }
    document.getElementById('visitor-count').textContent =
      '👁 오늘 방문자: ' + count.toLocaleString('ko-KR') + '명';
  } catch (e) {
    document.getElementById('visitor-count').textContent = '';
  }
})();
</script>
</body>
</html>
