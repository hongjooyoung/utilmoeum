<body>

<!-- ────────────── 헤더 ────────────── -->
<header class="site-header py-3">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="site-logo">⚙️ 유틸모음</a>
    <a href="index.html" class="btn btn-sm btn-outline-secondary">← 목록으로</a>
  </div>
</header>

<!-- ────────────── 광고: 헤더 하단 728x90 ────────────── -->
<div class="py-2 bg-white border-bottom">
  <div class="container d-flex justify-content-center">
    <div class="ad-slot ad-header">광고 (728×90)</div>
  </div>
</div>

<!-- ────────────── 본문 ────────────── -->
<main class="container py-5">

  <!-- 타이틀 & 월 선택 -->
  <div class="calc-card mb-4">
    <div class="d-flex align-items-center gap-2 mb-1">
      <span style="font-size:1.6rem;">🏠</span>
      <span class="calc-title">서울 강서구 아파트 실거래가</span>
    </div>
    <p class="text-muted small mb-4">국토교통부 실거래가 공개시스템 데이터 기준</p>

    <div class="d-flex align-items-center gap-3">
      <div>
        <label for="dealMonth" class="form-label fw-semibold mb-1">조회 월</label>
        <select id="dealMonth" class="form-select" style="width:180px;"></select>
      </div>
      <div class="mt-3">
        <button class="btn-calc" id="searchBtn" onclick="loadData()" style="width:auto; padding:.6rem 1.5rem;">조회</button>
      </div>
    </div>
  </div>

  <!-- 결과 영역 -->
  <div id="resultArea" style="display:none;">

    <div class="calc-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0" style="font-size:1rem;" id="resultTitle">—</h3>
        <span class="text-muted small" id="totalCount"></span>
      </div>

      <div class="table-responsive deduction-table">
        <table class="table table-bordered table-hover" id="resultTable">
          <thead>
            <tr>
              <th>아파트</th>
              <th class="text-end">거래금액</th>
              <th class="text-center">전용면적</th>
              <th class="text-center">층</th>
              <th class="text-center">계약일</th>
              <th>도로명</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 광고: 결과 바로 아래 300x250 -->
    <div class="d-flex justify-content-center mb-4">
      <div class="ad-slot ad-result">광고 (300×250)</div>
    </div>

  </div><!-- /resultArea -->

  <!-- 로딩 -->
  <div id="loadingArea" class="text-center py-5" style="display:none;">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-2 small">데이터를 불러오는 중...</p>
  </div>

  <!-- 오류 -->
  <div id="errorArea" class="calc-card text-center py-4" style="display:none;">
    <p class="text-danger mb-0" id="errorMsg"></p>
  </div>

</main>

<!-- ────────────── 푸터 ────────────── -->
<footer class="site-footer py-4">
  <div class="container">
    <div class="d-flex justify-content-center mb-3">
      <div class="ad-slot ad-footer">광고 (320×50)</div>
    </div>
    <div class="text-center">
      <p class="mb-1">© 2024 유틸모음. 제공하는 계산 결과는 참고용이며 법적 효력이 없습니다.</p>
      <p class="mb-0"><a href="#">이용약관</a> · <a href="#">개인정보처리방침</a></p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
const WORKER_URL = 'https://utilmoeum-proxy.stdioh.workers.dev';
const LAWD_CD    = '11500'; // 서울 강서구

// ── 월 선택 드롭다운 초기화 ──
(function initMonths() {
  const sel = document.getElementById('dealMonth');
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const yyyy = d.getFullYear();
    const mm   = String(d.getMonth() + 1).padStart(2, '0');
    const val  = `${yyyy}${mm}`;
    const label = `${yyyy}년 ${parseInt(mm)}월`;
    const opt = document.createElement('option');
    opt.value = val;
    opt.textContent = label;
    sel.appendChild(opt);
  }
})();

function fmtPrice(raw) {
  const n = parseInt(raw.replace(/,/g, '').trim(), 10);
  if (n >= 10000) {
    const uk  = Math.floor(n / 10000);
    const rem = n % 10000;
    return rem > 0
      ? `${uk.toLocaleString()}억 ${rem.toLocaleString()}만원`
      : `${uk.toLocaleString()}억원`;
  }
  return `${n.toLocaleString()}만원`;
}

function getTag(xml, tag) {
  const el = xml.querySelector(tag);
  return el ? el.textContent.trim() : '';
}

async function loadData() {
  const dealYmd = document.getElementById('dealMonth').value;

  $('#resultArea').hide();
  $('#errorArea').hide();
  $('#loadingArea').show();

  try {
    const url = `${WORKER_URL}?LAWD_CD=${LAWD_CD}&DEAL_YMD=${dealYmd}&numOfRows=100&pageNo=1`;
    const res  = await fetch(url);
    const text = await res.text();

    const parser = new DOMParser();
    const xml    = parser.parseFromString(text, 'application/xml');

    const resultCode = getTag(xml, 'resultCode');
    if (resultCode && resultCode !== '00' && resultCode !== '000') {
      throw new Error(getTag(xml, 'resultMsg') || '데이터 조회 실패');
    }

    const items = Array.from(xml.querySelectorAll('item'));
    if (items.length === 0) {
      throw new Error('해당 월의 거래 데이터가 없습니다.');
    }

    // 거래금액 기준 내림차순 정렬
    items.sort((a, b) => {
      const pa = parseInt(getTag(a, 'dealAmount').replace(/,/g, ''), 10);
      const pb = parseInt(getTag(b, 'dealAmount').replace(/,/g, ''), 10);
      return pb - pa;
    });

    const totalCount = getTag(xml, 'totalCount') || items.length;
    const yyyy = dealYmd.slice(0, 4);
    const mm   = parseInt(dealYmd.slice(4, 6));

    $('#resultTitle').text(`${yyyy}년 ${mm}월 강서구 아파트 실거래가`);
    $('#totalCount').text(`총 ${parseInt(totalCount).toLocaleString()}건`);

    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';

    items.forEach(item => {
      const aptName = getTag(item, 'aptNm');
      const price   = fmtPrice(getTag(item, 'dealAmount'));
      const area    = parseFloat(getTag(item, 'excluUseAr')).toFixed(1);
      const floor   = getTag(item, 'floor');
      const year    = getTag(item, 'dealYear');
      const month   = getTag(item, 'dealMonth').padStart(2, '0');
      const day     = getTag(item, 'dealDay').padStart(2, '0');
      const road    = getTag(item, 'roadNm');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="fw-semibold">${aptName}</td>
        <td class="text-end fw-bold text-primary">${price}</td>
        <td class="text-center">${area}㎡</td>
        <td class="text-center">${floor}층</td>
        <td class="text-center text-muted small">${year}.${month}.${day}</td>
        <td class="text-muted small">${road}</td>
      `;
      tbody.appendChild(tr);
    });

    $('#loadingArea').hide();
    $('#resultArea').fadeIn(300);
    $('html, body').animate({ scrollTop: $('#resultArea').offset().top - 20 }, 400);

  } catch (e) {
    $('#loadingArea').hide();
    $('#errorMsg').text(e.message || '데이터를 불러오지 못했습니다.');
    $('#errorArea').show();
  }
}

// 페이지 로드 시 자동 조회
$(function () { loadData(); });
</script>
</body>
</html>
